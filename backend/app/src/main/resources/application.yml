# app/src/main/resources/application.yml

spring:
  application:
    name: multiagent-platform

  datasource:
    url: ${SPRING_JDBC_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30m
      max-acquire-time: 5s  # 연결 획득 최대 대기 시간
      max-create-connection-time: 5s  # 새 연결 생성 최대 시간
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    url: ${SPRING_JDBC_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  jackson:
    mapper:
      ACCEPT_CASE_INSENSITIVE_ENUMS: true

server:
  port: 8080

# 신규 표준 키: WebClient 타임아웃/풀 설정 (코드 하드코딩 제거용)
webclient:
  default:
    connect-timeout: 1000ms
    read-timeout:    1000ms
    response-timeout: 2500ms
    pool:
      name: custom
      max-connections: 500
      pending-acquire-timeout: 5s
      max-idle-time: 20s
      max-life-time: 60s
  llm:
    connect-timeout: 1s
    read-timeout:    1s
    response-timeout: 2500ms
    pool:
      name: llm-pool
      max-connections: 200
      pending-acquire-timeout: 3s
      max-idle-time: 30s
  agent:
    connect-timeout: 1s
    read-timeout:    5s
    response-timeout: 2500ms
    pool:
      name: agent-pool
      max-connections: 200
      pending-acquire-timeout: 3s
      max-idle-time: 30s

# Reactor Scheduler 설정(신규 표준 키)
reactor:
  scheduler:
    bounded-elastic:
      max-threads: 32          # 초기값: CPU*4 수준으로 튜닝 가능
      queue-capacity: 10000
      ttl-seconds: 60
      thread-name: json-parsing
      daemon: true

# 연산자(reactor 체인) 레벨 타임아웃
orchestrator:
  timeouts:
    llm-operator: 2000ms
    agent-operator: 500ms
    agent-health: 500ms
    plan-operator: 2000ms
    broker-operator: 2000ms

broker:
  service:
    url: http://localhost:8080/api/v1/agents

llm:
  client:
    api-key: ${OPENAI_API_KEY}
    api-url: http://wiremock:8080/v1/chat/completions
    # https://api.openai.com/v1/chat/completions
    model: gpt-4

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

resilience4j:
  retry:
    instances:
      openAIClientRetry:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        randomizationFactor: 0.2
        retryExceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException$TooManyRequests
          - java.io.IOException
          - java.net.ConnectException
          - reactor.netty.http.client.PrematureCloseException
      brokerRetry:
        maxAttempts: 1
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        randomizationFactor: 0.2

  circuitbreaker:
    configs:
      default:
        slidingWindowType: TIME_BASED
        slidingWindowSize: 60
        failureRateThreshold: 50
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 10
    instances:
      executorCircuit:
        baseConfig: default
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        waitDurationInOpenState: 5s
      openAIClientCB:
        baseConfig: default
      brokerCB:
        baseConfig: default
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 20
        failureRateThreshold: 80
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
      agent-cb:
        baseConfig: default
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 10s

  bulkhead:
    instances:
      agent-bh:
        max-concurrent-calls: 200
        max-wait-duration: 200ms

  ratelimiter:
    instances:
      openaiRL:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: beans, health, info, prometheus, httptrace, metrics, env, loggers, configprops, threaddump, heapdump, mappings, circuitbreakers

logging:
  level:
    root: INFO
    com.infobank.multiagentplatform.config: DEBUG
    io.github.resilience4j.retry: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.context: DEBUG
    org.springframework.boot.env: DEBUG
    org.springframework.core.env: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.data.r2dbc: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
    io.r2dbc.postgresql.PARAM: DEBUG

  file:
    path: logs
    name: app.log
