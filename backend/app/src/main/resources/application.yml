# app/src/main/resources/application.yml

spring:
  application:
    name: multiagent-platform

  datasource:
    url: ${SPRING_JDBC_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    pool:
      enabled: true
      initial-size: 10      # 초기 연결 수 증가 (5 -> 10)
      max-size: 50          # 최대 연결 수 증가 (20 -> 50)
      max-idle-time: 30m
      max-acquire-time: 5s  # 연결 획득 최대 대기 시간
      max-create-connection-time: 5s  # 새 연결 생성 최대 시간
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    url: ${SPRING_JDBC_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  jackson:
    mapper:
      ACCEPT_CASE_INSENSITIVE_ENUMS: true

server:
  port: 8080

broker:
  service:
    url: http://localhost:8080/api/v1/agents

orchestrator:
  http:
    connect-timeout: 1000ms   # 1초 연결 타임아웃
    read-timeout:    30000ms   # 2초 응답 대기 타임아웃

llm:
  client:
    api-key: ${OPENAI_API_KEY}
    api-url: http://wiremock:8080/v1/chat/completions
    # https://api.openai.com/v1/chat/completions
    model: gpt-4
    connect-timeout: 10s
    read-timeout:    15s

agent:
  client:
    connect-timeout: 1s
    read-timeout: 5s

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

resilience4j:
  retry:
    instances:
      executorRetry:
        maxAttempts: 3
        waitDuration: 1s
      openAIClientRetry:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - com.infobank.multiagentplatform.orchestrator.exception.PlanParsingException
      brokerRetry:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0

  circuitbreaker:
    instances:
      executorCircuit:
        slidingWindowSize: 20         # 슬라이딩 윈도우 크기 증가 (10 -> 20)
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
      openAIClientCB:
        slidingWindowSize: 60
        slidingWindowType: TIME_BASED
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
      brokerCB:
        slidingWindowSize: 10         # 슬라이딩 윈도우 크기 증가 (5 -> 10)
        slidingWindowType: COUNT_BASED
        failureRateThreshold: 80      # 실패율 임계값 조정 (100 -> 80)
        waitDurationInOpenState: 30s  # 대기 시간 단축 (60s -> 30s)
      agent-cb:                       # RestAgentInvoker용 Circuit Breaker 추가
        slidingWindowSize: 20
        slidingWindowType: COUNT_BASED
        failureRateThreshold: 60
        waitDurationInOpenState: 10s

  bulkhead:
    instances:
      agent-bh:
        max-concurrent-calls: 200     # 동시 호출 수 증가 (100 -> 200)
        max-wait-duration: 1s         # 대기 시간 증가 (500ms -> 1s)

management:
  endpoints:
    web:
      exposure:
        include: beans, health, info, prometheus, httptrace, metrics

logging:
  level:
    root: INFO
    com.infobank.multiagentplatform.config: DEBUG
    io.github.resilience4j.retry: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.context: DEBUG
    org.springframework.boot.env: DEBUG
    org.springframework.core.env: DEBUG
    org.springframework.r2dbc: DEBUG
    org.springframework.data.r2dbc: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
    io.r2dbc.postgresql.PARAM: DEBUG

  file:
    path: logs
    name: app.log
