version: '3.8'

services:
#  db:
#    image: postgres:13
#    container_name: multi-agent-db
#    environment:
#      POSTGRES_DB: agentdb
#      POSTGRES_USER: user
#      POSTGRES_PASSWORD: password
#    volumes:
#      - postgres_data:/var/lib/postgresql/data
#    ports:
#      - "5432:5432"
#    networks:
#      - multi-agent-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multi-agent-backend
#    depends_on:
#      - db
    environment:
#      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/agentdb
#      - SPRING_DATASOURCE_USERNAME=user
#      - SPRING_DATASOURCE_PASSWORD=password
#      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - OPENAI_API_KEY=${OPENAI_API_KEY} # .env 파일에서 키를 읽어옵니다.
    ports:
      - "8080:8080"
    networks:
      - multi-agent-network
    volumes: # 👈 이 부분이 추가/수정된 핵심입니다.
      - ./h2-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multi-agent-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - multi-agent-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - multi-agent-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - multi-agent-network

networks:
  multi-agent-network:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
